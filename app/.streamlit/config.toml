[browser]
gatherUsageStats = false

[server]
address = "localhost"
headless = true

[client]
toolbarMode = "viewer"   # menu with the System / Light / Dark choice, no Deploy button: the app is local only

# Nemi look (presentation only). System fonts only: the app makes no network calls.
# Light and dark palettes: the app follows the computer's setting until the reviewer picks System, Light or
# Dark in the menu at the top right of the window.
[theme]
baseRadius = "6px"
headingFontWeights = 700
headingFontSizes = ["1.75rem", "1.375rem", "1.125rem"]
font = "'Segoe UI', 'Noto Sans', system-ui, -apple-system, sans-serif"

[theme.light]
primaryColor = "#0F766E"
backgroundColor = "#F6F7F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2A33"
linkColor = "#0F766E"
borderColor = "#D8DEE2"
redColor = "#B42318"

[theme.light.sidebar]
backgroundColor = "#EEF2F3"

[theme.dark]
primaryColor = "#0F766E"
backgroundColor = "#111518"
secondaryBackgroundColor = "#1A2025"
textColor = "#E6EAED"
linkColor = "#5EEAD4"
borderColor = "#33404A"
redColor = "#FF8A80"

[theme.dark.sidebar]
backgroundColor = "#151A1E"
