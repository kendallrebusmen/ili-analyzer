[browser]
gatherUsageStats = false

[server]
address = "localhost"
headless = true

[client]
toolbarMode = "minimal"   # no Deploy button: the app is local only

# Enterprise Suite look (presentation only). System fonts only: the app makes no network calls.
[theme]
base = "light"
primaryColor = "#0A6ED1"
backgroundColor = "#F5F6F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#223548"
linkColor = "#0A5FB4"
borderColor = "#D9DEE3"
redColor = "#AA0808"
baseRadius = "6px"
headingFontWeights = 700
headingFontSizes = ["1.75rem", "1.375rem", "1.125rem"]
font = "'Segoe UI', 'Noto Sans', system-ui, -apple-system, sans-serif"
